<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DoctorĐồng - Trải nghiệm Demo App Quản Lý Tài Chính & OCR Quét Hoá Đơn">
  
  <title>DoctorĐồng - Expense Tracker</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07070D;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient background lighting */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 50% 20%, rgba(212, 168, 67, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(40, 46, 64, 0.25) 0%, transparent 70%),
        #07070D;
    }

    /* Header action */
    .top-bar {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .apk-download-btn {
      background: linear-gradient(135deg, #1e2230 0%, #111420 100%);
      color: #e2e8f0;
      border: 1px solid rgba(212, 168, 67, 0.25);
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(212, 168, 67, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
    }

    .apk-download-btn svg {
      color: #d4a843;
    }

    .apk-download-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(212, 168, 67, 0.6);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 168, 67, 0.2);
      color: #ffffff;
    }

    /* Phone frame container */
    .phone-stage {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 16px;
    }

    .phone-mockup {
      position: relative;
      width: 393px;
      height: 852px;
      max-height: calc(100vh - 32px);
      aspect-ratio: 393 / 852;
      background: #000000;
      border-radius: 50px;
      border: 4px solid #282E40;
      box-shadow: 
        0 0 0 2px #12141c,
        0 25px 60px -10px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(212, 168, 67, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background-color: #000000;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
    }

    .dynamic-island::after {
      content: '';
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1c2333 0%, #080a10 70%);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* App iframe */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #07070D;
    }

    /* Mobile screens (Real phones or small viewports <= 500px) */
    @media (max-width: 500px) {
      .ambient-bg {
        display: none;
      }

      .phone-stage {
        padding: 0;
      }

      .phone-mockup {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
        aspect-ratio: auto;
      }

      .dynamic-island {
        display: none;
      }

      .top-bar {
        top: 10px;
        right: 10px;
        opacity: 0.85;
      }

      .apk-download-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <div class="top-bar">
    <a href="https://github.com/HyLeeQ/Mini_Project_3/releases/download/v1.0.0/expense-tracker-arm64.apk" download="expense-tracker-arm64.apk" class="apk-download-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Tải APK (34 MB)
    </a>
  </div>

  <div class="phone-stage">
    <div class="phone-mockup">
      <div class="dynamic-island"></div>
      <iframe class="app-frame" src="app.html" title="DoctorĐồng Expense Tracker"></iframe>
    </div>
  </div>
</body>
</html>
